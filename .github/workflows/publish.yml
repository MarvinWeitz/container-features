# Tests and publishes Dev Container Features to the GitHub Container Registry (GHCR)
# on every push to main.

name: Publish Dev Container Features

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run shellcheck
        run: shellcheck src/*/install.sh test/test.sh test/*/*.sh

  test:
    name: Test ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - btp-cli-tools
          - cap-dev-stack
          - dev-defaults
          - devcontainer-tools
          - fiori-dev-stack
          - npm-feeds
          - typescript
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: Test ${{ matrix.feature }} (scenarios)
        run: |
          devcontainer features test \
            --project-folder . \
            --skip-autogenerated \
            --features "${{ matrix.feature }}"

  publish:
    name: Publish to GHCR
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install @devcontainers/cli
        run: npm install -g @devcontainers/cli

      - name: Log in to GHCR
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish features
        run: |
          devcontainer features publish \
            --registry ghcr.io \
            --namespace "${GITHUB_REPOSITORY,,}" \
            ./src
